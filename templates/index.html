<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>PDF to Audio</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="mb-4 text-center">PDF to Audio</h1>

              <form
                method="POST"
                action="/convert"
                enctype="multipart/form-data"
              >
                <div class="mb-3">
                  <input
                    type="file"
                    name="pdf"
                    class="form-control"
                    accept=".pdf"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Convert PDF
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
